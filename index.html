<!DOCTYPE html>
<html lang="no" data-color-scheme="light" data-color="brand1">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Skolekartet – Nasjonale prøver visualisert på kart</title>
    <meta name="description" content="Interaktivt kart over norske skoler med resultater fra nasjonale prøver. Sammenlign barnerskoler og ungdomsskoler, og finn den beste skolen i ditt nærområde." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="keywords" content="nasjonale prøver, skolekart, velg skole, skoleoversikt, barneskole, ungdomsskole, skoleresultater, Norge, Oslo" />
    <meta name="author" content="Skolekartet" />
    <link rel="canonical" href="https://skolekartet.no/" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skolekartet.no/" />
    <meta property="og:title" content="Skolekartet – Nasjonale prøver visualisert på kart" />
    <meta property="og:description" content="Interaktivt kart over norske skoler med resultater fra nasjonale prøver. Sammenlign skoler og finn den beste skolen i ditt nærområde." />
    <meta property="og:locale" content="nb_NO" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Skolekartet – Nasjonale prøver visualisert på kart" />
    <meta name="twitter:description" content="Interaktivt kart over norske skoler med resultater fra nasjonale prøver. Sammenlign skoler og finn den beste i ditt nærområde." />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>

    <!-- MapLibre GL CSS (renders the OpenFreeMap vector tiles) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css"/>

    <!-- Designsystemet (Digdir): font, theme and component CSS -->
    <link rel="stylesheet" id="dsTheme" href="https://cdn.jsdelivr.net/npm/@digdir/designsystemet-css@1.23.0/dist/theme/designsystemet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@digdir/designsystemet-css@1.23.0/dist/src/index.css" />

    <!-- Marker Cluster CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/MarkerCluster.css"/>


    <!-- Custom Styles -->
    <link rel="stylesheet" href="static/css/styles.css?v=140"/>
    <script src="static/js/i18n.js?v=73"></script>
    <script src="static/js/theme.js?v=7"></script>

    <!-- Leaflet JS -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>

    <!-- MapLibre GL + Leaflet binding: OpenFreeMap vector tiles as a Leaflet layer.
         MapLibre 5 is the last line with a browser (UMD) build; v6 is ESM-only. -->
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>

    <!-- Designsystemet web: dialog, popover, field, suggestion and tooltip behaviour -->
    <script src="https://cdn.jsdelivr.net/npm/@digdir/designsystemet-web@1.23.0/dist/umd/index.js"></script>

    <!-- Marker Cluster JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/leaflet.markercluster.js"></script>

    <script>
        L_NO_TOUCH = false;
        L_DISABLE_3D = false;
    </script>
</head>
<body>
    <a class="ds-skip-link" href="#main">Hopp til hovedinnhold</a>

    <!-- Header (shared, see static/js/layout.js) -->
    <div id="site-header"></div>
    <script src="static/js/layout.js?v=21"></script>

    <main id="main" tabindex="-1">
        <!-- One search row (choose what to search by), filters below -->
        <section class="search-panel" aria-labelledby="searchHint">
            <div class="site-container">
                <h1 class="ds-heading" data-size="sm" id="searchHint">Leter du etter en skole?</h1>

                <div class="search-bar" role="search">
                    <fieldset class="ds-fieldset search-mode">
                        <legend class="ds-label">Søk på</legend>
                        <ds-field class="ds-field">
                            <input class="ds-input" type="radio" name="searchMode" id="modeAddress" value="address" checked />
                            <label class="ds-label" data-weight="regular" for="modeAddress">Adresse</label>
                        </ds-field>
                        <ds-field class="ds-field">
                            <input class="ds-input" type="radio" name="searchMode" id="modeSchool" value="school" />
                            <label class="ds-label" data-weight="regular" for="modeSchool">Skolenavn</label>
                        </ds-field>
                    </fieldset>
                    <div class="search-bar__field">
                        <ds-field class="ds-field" id="addressField">
                            <label class="ds-label ds-sr-only" for="addressSearch">Adresse</label>
                            <div class="address-input">
                                <ds-suggestion class="ds-suggestion" id="addressSuggestion">
                                    <input class="ds-input" type="search" id="addressSearch" placeholder="F.eks. Kirkeveien 64, Oslo" autocomplete="off" />
                                    <del aria-label="Tøm adressesøk"></del>
                                    <u-datalist id="addressResults" data-nofilter data-sr-singular="%d adresse" data-sr-plural="%d adresser"></u-datalist>
                                </ds-suggestion>
                                <!-- "Din posisjon", like Entur and Vy: an icon in the empty field and the first suggestion when the
                                     field gets focus. The browser asks for the position only then (see finder.js, bindLocate). -->
                                <button type="button" class="ds-button locate-inline" data-variant="tertiary" data-size="sm" data-icon
                                        id="locateButton" aria-label="Bruk min posisjon" data-tooltip="Bruk min posisjon" hidden><svg class="ds-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="6.25" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2.25" fill="currentColor"/><path d="M12 2.75V5.75M12 18.25V21.25M2.75 12H5.75M18.25 12H21.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
                            </div>
                        </ds-field>
                        <ds-field class="ds-field" id="schoolField" hidden>
                            <label class="ds-label ds-sr-only" for="schoolSearch">Skolenavn</label>
                            <ds-suggestion class="ds-suggestion" id="schoolSuggestion">
                                <input class="ds-input" type="search" id="schoolSearch" placeholder="F.eks. Majorstuen skole" autocomplete="off" />
                                <del aria-label="Tøm skolesøk"></del>
                                <u-datalist id="searchResults" data-nofilter data-sr-singular="%d skole" data-sr-plural="%d skoler"></u-datalist>
                            </ds-suggestion>
                        </ds-field>
                    </div>
                    <!-- The site's main idea gets its own button: results from the national tests, as a row under the search -->
                    <button type="button" class="ds-button score-toggle" data-variant="secondary"
                            id="scoreToggle" aria-expanded="false" aria-controls="scoreBar">
                        <span class="score-toggle__dots" aria-hidden="true"><span class="color-dot score-very-low"></span><span class="color-dot score-low"></span><span class="color-dot score-high"></span><span class="color-dot score-very-high"></span></span>Nasjonale prøver
                    </button>
                    <button type="button" class="ds-button filter-toggle" data-variant="secondary"
                            id="filterToggle" aria-expanded="false" aria-controls="filterPanel">
                        <svg class="ds-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M3.25 7C3.25 6.58579 3.58579 6.25 4 6.25H20C20.4142 6.25 20.75 6.58579 20.75 7C20.75 7.41421 20.4142 7.75 20 7.75L4 7.75C3.58579 7.75 3.25 7.41421 3.25 7ZM6.25 12C6.25 11.5858 6.58579 11.25 7 11.25H17C17.4142 11.25 17.75 11.5858 17.75 12C17.75 12.4142 17.4142 12.75 17 12.75H7C6.58579 12.75 6.25 12.4142 6.25 12ZM10 16.25C9.58579 16.25 9.25 16.5858 9.25 17C9.25 17.4142 9.58579 17.75 10 17.75H14C14.4142 17.75 14.75 17.4142 14.75 17C14.75 16.5858 14.4142 16.25 14 16.25H10Z" fill-rule="evenodd" clip-rule="evenodd" fill="currentColor"/></svg><span id="filterToggleLabel">Filter</span><span class="ds-badge" data-size="sm" id="filterCount" hidden></span>
                    </button>
                    <button type="button" class="ds-button filter-reset" data-variant="tertiary" id="resetFilters" data-aksel="arrowCirclepath" disabled>Nullstill</button>
                </div>

                <!-- "Nasjonale prøver": the same choices as in the filter panel (same name="score", kept in step by
                     finder.js), so the main filter is one click away -->
                <fieldset class="ds-fieldset score-bar" id="scoreBar" hidden>
                    <legend class="ds-label" data-size="sm"><span data-score-title>Snitt nasjonale prøver</span></legend>
                    <div class="filter-checks__options score-bar__options">
                        <ds-field class="ds-field filter-option">
                            <input class="ds-input" type="checkbox" id="q-score-very-low" name="score" value="very-low" checked />
                            <label class="ds-label" data-weight="regular" for="q-score-very-low"><span class="color-dot score-very-low" aria-hidden="true"></span>Under 45</label>
                        </ds-field>
                        <ds-field class="ds-field filter-option">
                            <input class="ds-input" type="checkbox" id="q-score-low" name="score" value="low" checked />
                            <label class="ds-label" data-weight="regular" for="q-score-low"><span class="color-dot score-low" aria-hidden="true"></span>45–49,3</label>
                        </ds-field>
                        <ds-field class="ds-field filter-option">
                            <input class="ds-input" type="checkbox" id="q-score-high" name="score" value="high" checked />
                            <label class="ds-label" data-weight="regular" for="q-score-high"><span class="color-dot score-high" aria-hidden="true"></span>49,3–55</label>
                        </ds-field>
                        <ds-field class="ds-field filter-option">
                            <input class="ds-input" type="checkbox" id="q-score-very-high" name="score" value="very-high" checked />
                            <label class="ds-label" data-weight="regular" for="q-score-very-high"><span class="color-dot score-very-high" aria-hidden="true"></span>55 og over</label>
                        </ds-field>
                        <ds-field class="ds-field filter-option">
                            <input class="ds-input" type="checkbox" id="q-score-none" name="score" value="none" checked />
                            <label class="ds-label" data-weight="regular" for="q-score-none"><span class="color-dot score-none" aria-hidden="true"></span>Ingen data</label>
                        </ds-field>
                        </div>
                </fieldset>

                <!-- Filters slide in from the right (Designsystemet Dialog, data-placement="right"), as on many
                     search pages; on phones the panel takes the whole width. The results update as you choose. -->
                <dialog class="ds-dialog filter-dialog" data-placement="right" id="filterPanel" aria-labelledby="filterDialogTitle">
                    <div class="filter-dialog__head">
                        <h2 class="ds-heading" data-size="xs" id="filterDialogTitle">Filter</h2>
                        <button type="button" class="ds-button" data-variant="tertiary" data-size="sm" data-icon id="filterClose"
                                aria-label="Lukk filter" data-tooltip="Lukk filter"><svg class="ds-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M6.53 5.47a.75.75 0 0 0-1.06 1.06L10.94 12l-5.47 5.47a.75.75 0 1 0 1.06 1.06L12 13.06l5.47 5.47a.75.75 0 1 0 1.06-1.06L13.06 12l5.47-5.47a.75.75 0 0 0-1.06-1.06L12 10.94z" fill="currentColor"/></svg></button>
                    </div>
                    <div class="filter-bar" role="group" aria-label="Filtrer skoler">
                    <fieldset class="ds-fieldset filter-group filter-checks">
                        <legend class="ds-label filter-legend" data-size="sm">Skoletype
                        </legend>
                        <div class="filter-checks__options">
                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="checkbox" id="f-type-barneskole" name="type" value="barneskole" checked />
                                <label class="ds-label" data-weight="regular" for="f-type-barneskole"><span class="chip-icon" data-type-icon="barneskole"></span>Barneskole</label>
                            </ds-field>
                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="checkbox" id="f-type-ungdomsskole" name="type" value="ungdomsskole" checked />
                                <label class="ds-label" data-weight="regular" for="f-type-ungdomsskole"><span class="chip-icon" data-type-icon="ungdomsskole"></span>Ungdomsskole</label>
                            </ds-field>
                        </div>
                    </fieldset>
                    <fieldset class="ds-fieldset filter-group filter-checks">
                        <legend class="ds-label filter-legend" data-size="sm">Eierform
                        </legend>
                        <div class="filter-checks__options">
                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="checkbox" id="f-owner-offentlig" name="owner" value="offentlig" checked />
                                <label class="ds-label" data-weight="regular" for="f-owner-offentlig"><span class="chip-icon" data-owner-icon="offentlig"></span>Offentlig</label>
                            </ds-field>
                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="checkbox" id="f-owner-privat" name="owner" value="privat" checked />
                                <label class="ds-label" data-weight="regular" for="f-owner-privat"><span class="chip-icon" data-owner-icon="privat"></span>Privat</label>
                            </ds-field>
                        </div>
                    </fieldset>
                    <ds-field class="ds-field filter-group">
                        <label class="ds-label" data-size="sm" for="kommuneFilter">Kommune</label>
                        <select class="ds-input" id="kommuneFilter" data-size="sm">
                            <option value="">Alle kommuner</option>
                        </select>
                    </ds-field>
                    <!-- Profil: one choice, so radio buttons; the profiles with schools are added by finder.js -->
                    <fieldset class="ds-fieldset filter-group filter-checks" id="profileFilter">
                        <legend class="ds-label filter-legend" data-size="sm">Profil</legend>
                        <div class="filter-checks__options" id="profileOptions">
                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="radio" id="f-profile-alle" name="profile" value="" checked />
                                <label class="ds-label" data-weight="regular" for="f-profile-alle">Alle</label>
                            </ds-field>
                        </div>
                    </fieldset>
                    <fieldset class="ds-fieldset filter-group filter-checks">
                        <legend class="ds-label filter-legend" data-size="sm"><span data-score-title>Snitt nasjonale prøver</span>
                            <button type="button" class="ds-button filter-help" data-variant="tertiary" data-size="sm" data-icon id="snittHelp"
                            data-tooltip="Snittet er gjennomsnittet av skolens skalapoeng i engelsk, lesing og regning på nasjonale prøver 2025–26. Fag uten publisert resultat telles ikke med. Skalaen er satt slik at landsgjennomsnittet var 50 i 2022." data-placement="top"><svg class="ds-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M12 3.75C7.44365 3.75 3.75 7.44365 3.75 12C3.75 16.5563 7.44365 20.25 12 20.25C16.5563 20.25 20.25 16.5563 20.25 12C20.25 7.44365 16.5563 3.75 12 3.75ZM2.25 12C2.25 6.61522 6.61522 2.25 12 2.25C17.3848 2.25 21.75 6.61522 21.75 12C21.75 17.3848 17.3848 21.75 12 21.75C6.61522 21.75 2.25 17.3848 2.25 12ZM11.0498 16.9C11.0498 16.3753 11.4751 15.95 11.9998 15.95C12.5245 15.95 12.9498 16.3753 12.9498 16.9C12.9498 17.4247 12.5245 17.85 11.9998 17.85C11.4751 17.85 11.0498 17.4247 11.0498 16.9ZM10.25 9.5C10.25 8.5335 11.0335 7.75 12 7.75H12.1361C13.0274 7.75 13.75 8.47255 13.75 9.36387C13.75 9.85413 13.5271 10.3178 13.1443 10.6241L12.7028 10.9773C11.7845 11.7119 11.25 12.8241 11.25 14C11.25 14.4142 11.5858 14.75 12 14.75C12.4142 14.75 12.75 14.4142 12.75 14C12.75 13.2797 13.0774 12.5985 13.6398 12.1486L14.0814 11.7954C14.82 11.2045 15.25 10.3098 15.25 9.36387C15.25 7.64413 13.8559 6.25 12.1361 6.25H12C10.2051 6.25 8.75 7.70507 8.75 9.5C8.75 9.91421 9.08579 10.25 9.5 10.25C9.91421 10.25 10.25 9.91421 10.25 9.5Z" fill-rule="evenodd" clip-rule="evenodd" fill="currentColor"/></svg></button>
                        </legend>
                        <div class="filter-checks__options">
                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="checkbox" id="f-score-very-low" name="score" value="very-low" checked />
                                <label class="ds-label" data-weight="regular" for="f-score-very-low"><span class="color-dot score-very-low" aria-hidden="true"></span>Under 45</label>
                            </ds-field>
                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="checkbox" id="f-score-low" name="score" value="low" checked />
                                <label class="ds-label" data-weight="regular" for="f-score-low"><span class="color-dot score-low" aria-hidden="true"></span>45–49,3</label>
                            </ds-field>
                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="checkbox" id="f-score-high" name="score" value="high" checked />
                                <label class="ds-label" data-weight="regular" for="f-score-high"><span class="color-dot score-high" aria-hidden="true"></span>49,3–55</label>
                            </ds-field>
                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="checkbox" id="f-score-very-high" name="score" value="very-high" checked />
                                <label class="ds-label" data-weight="regular" for="f-score-very-high"><span class="color-dot score-very-high" aria-hidden="true"></span>55 og over</label>
                            </ds-field>
                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="checkbox" id="f-score-none" name="score" value="none" checked />
                                <label class="ds-label" data-weight="regular" for="f-score-none"><span class="color-dot score-none" aria-hidden="true"></span>Ingen data</label>
                            </ds-field>
                        </div>
                    </fieldset>
                    <fieldset class="ds-fieldset filter-group filter-checks">
                        <legend class="ds-label filter-legend" data-size="sm">Trivsel (1–5)
                            <button type="button" class="ds-button filter-help" data-variant="tertiary" data-size="sm" data-icon
                            data-tooltip="Elevenes gjennomsnittlige svar på «Trives du på skolen?» i Elevundersøkelsen, på en skala fra 1 til 5. 7. trinn for barneskoler og 10. trinn for ungdomsskoler. Små grupper er skjult av Udir." data-placement="top"><svg class="ds-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M12 3.75C7.44365 3.75 3.75 7.44365 3.75 12C3.75 16.5563 7.44365 20.25 12 20.25C16.5563 20.25 20.25 16.5563 20.25 12C20.25 7.44365 16.5563 3.75 12 3.75ZM2.25 12C2.25 6.61522 6.61522 2.25 12 2.25C17.3848 2.25 21.75 6.61522 21.75 12C21.75 17.3848 17.3848 21.75 12 21.75C6.61522 21.75 2.25 17.3848 2.25 12ZM11.0498 16.9C11.0498 16.3753 11.4751 15.95 11.9998 15.95C12.5245 15.95 12.9498 16.3753 12.9498 16.9C12.9498 17.4247 12.5245 17.85 11.9998 17.85C11.4751 17.85 11.0498 17.4247 11.0498 16.9ZM10.25 9.5C10.25 8.5335 11.0335 7.75 12 7.75H12.1361C13.0274 7.75 13.75 8.47255 13.75 9.36387C13.75 9.85413 13.5271 10.3178 13.1443 10.6241L12.7028 10.9773C11.7845 11.7119 11.25 12.8241 11.25 14C11.25 14.4142 11.5858 14.75 12 14.75C12.4142 14.75 12.75 14.4142 12.75 14C12.75 13.2797 13.0774 12.5985 13.6398 12.1486L14.0814 11.7954C14.82 11.2045 15.25 10.3098 15.25 9.36387C15.25 7.64413 13.8559 6.25 12.1361 6.25H12C10.2051 6.25 8.75 7.70507 8.75 9.5C8.75 9.91421 9.08579 10.25 9.5 10.25C9.91421 10.25 10.25 9.91421 10.25 9.5Z" fill-rule="evenodd" clip-rule="evenodd" fill="currentColor"/></svg></button>
                        </legend>
                        <div class="filter-checks__options">
                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="checkbox" id="f-trivsel-u38" name="trivsel" value="u38" checked />
                                <label class="ds-label" data-weight="regular" for="f-trivsel-u38">Under 3,8</label>
                            </ds-field>
                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="checkbox" id="f-trivsel-38" name="trivsel" value="38" checked />
                                <label class="ds-label" data-weight="regular" for="f-trivsel-38">3,8–3,9</label>
                            </ds-field>
                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="checkbox" id="f-trivsel-40" name="trivsel" value="40" checked />
                                <label class="ds-label" data-weight="regular" for="f-trivsel-40">4,0–4,1</label>
                            </ds-field>
                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="checkbox" id="f-trivsel-42" name="trivsel" value="42" checked />
                                <label class="ds-label" data-weight="regular" for="f-trivsel-42">4,2–4,3</label>
                            </ds-field>
                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="checkbox" id="f-trivsel-44" name="trivsel" value="44" checked />
                                <label class="ds-label" data-weight="regular" for="f-trivsel-44">4,4 og over</label>

                            <ds-field class="ds-field filter-option">
                                <input class="ds-input" type="checkbox" id="f-trivsel-none" name="trivsel" value="none" checked />
                                <label class="ds-label" data-weight="regular" for="f-trivsel-none">Ingen data</label>
                            </ds-field>
                        </div>
                    </fieldset>
                    <fieldset class="ds-fieldset filter-group filter-checks">
