<!DOCTYPE html>
<html lang="no" data-color-scheme="light" data-color="brand1">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tilbakemelding – Skolekartet</title>
    <meta name="description" content="Send spørsmål, feil eller forslag til Skolekartet." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="canonical" href="https://skolekartet.no/tilbakemelding.html" />

    <!-- Designsystemet (Digdir): font, theme and component CSS -->
    <link rel="stylesheet" id="dsTheme" href="https://cdn.jsdelivr.net/npm/@digdir/designsystemet-css@1.23.0/dist/theme/designsystemet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@digdir/designsystemet-css@1.23.0/dist/src/index.css" />


    <link rel="stylesheet" href="static/css/styles.css?v=142"/>

    <script src="static/js/i18n.js?v=73"></script>
    <script src="static/js/theme.js?v=7"></script>
    <script src="https://cdn.jsdelivr.net/npm/@digdir/designsystemet-web@1.23.0/dist/umd/index.js"></script>
</head>
<body>
    <a class="ds-skip-link" href="#main">Hopp til hovedinnhold</a>

    <!-- Header (shared, see static/js/layout.js) -->
    <div id="site-header"></div>
    <script src="static/js/layout.js?v=22"></script>

    <main id="main" tabindex="-1" class="page">
        <div class="site-container page__container">
            <a class="ds-button page__back" data-variant="tertiary" data-size="sm" href="./" data-back>Tilbake</a>
            <article class="page__content">
            <h1 class="ds-heading" data-size="md"><svg class="ds-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M3 5.25C2.58579 5.25 2.25 5.58579 2.25 6V19C2.25 19.4142 2.58579 19.75 3 19.75H21C21.4142 19.75 21.75 19.4142 21.75 19V6C21.75 5.58579 21.4142 5.25 21 5.25H3ZM3.75 17.1893L9.02277 11.9166L3.75 8.40139V17.1893ZM10.2956 12.7651L4.81066 18.25H19.1893L13.7044 12.7651L12.416 13.624C12.1641 13.792 11.8359 13.792 11.584 13.624L10.2956 12.7651ZM14.9772 11.9166L20.25 8.40139V17.1893L14.9772 11.9166ZM3.97708 6.75L12 12.0986L20.0229 6.75H3.97708Z" fill-rule="evenodd" clip-rule="evenodd" fill="currentColor"/></svg>Send tilbakemelding</h1>
            <p class="ds-paragraph" data-size="sm">Har du spørsmål, feil du vil melde fra om, eller forslag til forbedringer? Vi setter pris på din tilbakemelding!</p>
            
            <form id="feedbackForm" class="feedback-form"
                  action="https://formspree.io/f/xzdalbbr"
                  method="POST"
                  onsubmit="handleFeedbackSubmit(event)">
            
                <ds-field class="ds-field">
                    <label class="ds-label" for="feedbackEmail">Din e-post <span class="ds-label-hint">(valgfritt)</span></label>
                    <input class="ds-input" type="email" id="feedbackEmail" name="email" placeholder="din@epost.no" />
                </ds-field>
            
                <ds-field class="ds-field">
                    <label class="ds-label" for="feedbackMessage">
                        Melding
                        <span class="ds-tag" data-color="warning" data-size="sm">Må fylles ut</span>
                    </label>
                    <textarea class="ds-input" id="feedbackMessage" name="message" required
                              placeholder="Skriv din melding her..." rows="5"></textarea>
                </ds-field>
            
                <div id="feedbackStatus" class="ds-alert" data-color="success" role="status" hidden></div>
            
                <button type="submit" class="ds-button" data-fullwidth id="feedbackSubmitBtn">Send melding</button>
            </form>
            </article>
        </div>
    </main>

    <!-- Footer (shared, see static/js/layout.js) -->
    <div id="site-footer"></div>
    <script src="static/js/feedback.js?v=1"></script>
</body>
</html>
