<body class="map-page">
    <a class="ds-skip-link" href="#main">Hopp til hovedinnhold</a>

    <!-- Header (shared, see static/js/layout.js) -->
    <div id="site-header"></div>
    <script src="static/js/layout.js?v=32"></script>

    <!-- A map with layers (schools and boundaries) and tools to find your position, draw, measure distance and
         area, change the background map and zoom, as in the kommunes' own map services; everything here is
         open data (static/js/kart.js) -->
    <main id="main" tabindex="-1" class="map-page__main">
        <h1 class="ds-sr-only">Skolekart med kartlag, tegning og måling</h1>
        <div class="map-page__map" id="toolMap" aria-label="Kart"></div>

        <!-- Top: search for an address or a school in the middle, the layers in the right corner -->
        <div class="map-page__top">
            <div class="map-search">
                <label class="ds-sr-only" for="mapSearch">Søk på adresse, skole, kommune eller postnummer</label>
                <input class="ds-input" type="search" id="mapSearch" autocomplete="off" placeholder="Adresse, skole, kommune eller postnummer"
                       aria-controls="mapSearchResults" aria-expanded="false" />
                <ul class="map-search__results ds-card" id="mapSearchResults" hidden></ul>
            </div>
            <button type="button" class="ds-button map-layers-toggle" data-variant="secondary" id="layersToggle"
                    aria-expanded="false" aria-controls="layersPanel" data-aksel="layers"><span>Kartlag</span></button>
        </div>

        <!-- The layers: schools and boundaries, each one on or off -->
        <section class="map-layers ds-card" id="layersPanel" aria-labelledby="layersTitle" hidden>
            <div class="map-layers__head">
                <h2 class="ds-heading" data-size="xs" id="layersTitle">Kartlag</h2>
                <button type="button" class="ds-button" data-variant="tertiary" data-size="sm" data-icon id="layersClose"
                        aria-label="Lukk kartlag" data-aksel="xMark"></button>
            </div>
            <fieldset class="ds-fieldset map-layers__group">
                <legend class="ds-label" data-size="sm">Skoler</legend>
                <ds-field class="ds-field"><input class="ds-input" type="checkbox" id="layer-barneskole" data-layer="barneskole" checked />
                    <label class="ds-label" data-weight="regular" for="layer-barneskole"><span class="map-layers__icon" data-type-icon="barneskole"></span>Barneskoler</label></ds-field>
                <ds-field class="ds-field"><input class="ds-input" type="checkbox" id="layer-ungdomsskole" data-layer="ungdomsskole" checked />
                    <label class="ds-label" data-weight="regular" for="layer-ungdomsskole"><span class="map-layers__icon" data-type-icon="ungdomsskole"></span>Ungdomsskoler</label></ds-field>
                <ds-field class="ds-field"><input class="ds-input" type="checkbox" id="layer-videregaende" data-layer="videregaende" />
                    <label class="ds-label" data-weight="regular" for="layer-videregaende"><span class="map-layers__icon" data-type-icon="videregaende"></span>Videregående skoler</label></ds-field>
            </fieldset>
            <fieldset class="ds-fieldset map-layers__group">
                <legend class="ds-label" data-size="sm">Grenser</legend>
                <ds-field class="ds-field"><input class="ds-input" type="checkbox" id="layer-skolekretser" data-layer="skolekretser" />
                    <label class="ds-label" data-weight="regular" for="layer-skolekretser" id="kretsLayerLabel">Skolekretser (Halden, Stavanger, Fredrikstad)</label></ds-field>
                <ds-field class="ds-field"><input class="ds-input" type="checkbox" id="layer-bydeler" data-layer="bydeler" />
                    <label class="ds-label" data-weight="regular" for="layer-bydeler">Bydeler i Oslo</label></ds-field>
                <ds-field class="ds-field"><input class="ds-input" type="checkbox" id="layer-kommuner" data-layer="kommuner" />
                    <label class="ds-label" data-weight="regular" for="layer-kommuner">Kommuner</label></ds-field>
                <ds-field class="ds-field"><input class="ds-input" type="checkbox" id="layer-grunnkretser" data-layer="grunnkretser" />
                    <label class="ds-label" data-weight="regular" for="layer-grunnkretser">Grunnkretser</label></ds-field>
            </fieldset>
            <p class="ds-paragraph map-layers__note" data-size="xs"><span id="kretsOsloNote">Skolekretser i Oslo er ikke med: Oslo kommune har ikke publisert dem som åpne data.</span> Voksenopplæring har ikke et eget kartlag ennå. <a class="ds-link" href="om-skolekrets">Om skolekrets</a></p>
        </section>

        <!-- Bottom right: the tools; the drawing and measuring ones stay pressed while in use -->
        <div class="map-tools" role="toolbar" aria-label="Kartverktøy">
            <button type="button" class="ds-button map-tool" data-variant="secondary" data-icon id="toolLocate" data-aksel="target" aria-label="Min posisjon" data-tooltip="Min posisjon" data-placement="left"></button>
            <button type="button" class="ds-button map-tool" data-variant="secondary" data-icon id="toolErase" data-aksel="eraser" aria-label="Fjern tegninger og målinger" data-tooltip="Fjern tegninger og målinger" data-placement="left"></button>
            <button type="button" class="ds-button map-tool" data-variant="secondary" data-icon id="toolBase" data-aksel="globe" aria-label="Bytt bakgrunnskart" data-tooltip="Bytt bakgrunnskart" data-placement="left"></button>
            <button type="button" class="ds-button map-tool" data-variant="secondary" data-icon id="toolDraw" data-aksel="pencil" aria-pressed="false" aria-label="Tegn" data-tooltip="Tegn" data-placement="left"></button>
            <button type="button" class="ds-button map-tool" data-variant="secondary" data-icon id="toolDistance" data-aksel="ruler" aria-pressed="false" aria-label="Mål avstand" data-tooltip="Mål avstand" data-placement="left"></button>
            <button type="button" class="ds-button map-tool map-tool--text" data-variant="secondary" data-icon id="toolArea" aria-pressed="false" aria-label="Mål areal" data-tooltip="Mål areal" data-placement="left"><span aria-hidden="true">m²</span></button>
            <button type="button" class="ds-button map-tool" data-variant="secondary" data-icon id="toolZoomIn" data-aksel="plus" aria-label="Zoom inn" data-tooltip="Zoom inn" data-placement="left"></button>
            <button type="button" class="ds-button map-tool" data-variant="secondary" data-icon id="toolZoomOut" data-aksel="minus" aria-label="Zoom ut" data-tooltip="Zoom ut" data-placement="left"></button>
        </div>

        <!-- What to do while drawing or measuring, the result so far, and Ferdig / Angre / Avbryt -->
        <div class="map-hint ds-card" id="mapHint" role="status" hidden>
            <p class="ds-paragraph map-hint__text" data-size="sm" id="mapHintText"></p>
            <p class="ds-paragraph map-hint__result" id="mapHintResult"></p>
            <div class="map-hint__actions">
                <button type="button" class="ds-button" data-variant="primary" data-size="sm" id="hintDone">Ferdig</button>
                <button type="button" class="ds-button" data-variant="secondary" data-size="sm" id="hintUndo">Angre siste punkt</button>
                <button type="button" class="ds-button" data-variant="tertiary" data-size="sm" id="hintCancel">Avbryt</button>
            </div>
        </div>
    </main>

    <script src="static/js/score-colors.js?v=2"></script>
    <script src="static/js/shared.js?v=28"></script>
    <script src="static/js/kart.js?v=11"></script>
</body>
</html>
